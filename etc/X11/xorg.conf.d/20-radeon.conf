# SereinOS Xorg configuration for AMD Radeon HD 6320 Graphics (AMD E-450 APU)
# Enables Glamor 2D/3D hardware acceleration, TearFree buffer flipping, and DRI3

Section "Device"
    Identifier  "RadeonHD6320"
    Driver      "radeon"
    Option      "AccelMethod" "glamor"
    Option      "TearFree" "on"
    Option      "DRI" "3"
    Option      "ColorTiling" "on"
    Option      "ColorTiling2D" "on"
    Option      "EnablePageFlip" "on"
EndSection
