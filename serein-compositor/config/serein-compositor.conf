# Serein Compositor Configuration

outputs:
  - name: "eDP-1"
    x: 0
    y: 0
    width: 1920
    height: 1080
    scale: 1.0
    transform: 0
    enabled: true

input:
  identifier: "*"
  keymap_layout: "us"
  keymap_variant: ""
  keymap_options: ""
  repeat_rate: 25
  repeat_delay: 600
  accel_speed: 0.0
  natural_scroll: false

cursor:
  theme: "default"
  size: 24
  hide_timeout: true
  hide_seconds: 5

avatar:
  host: "127.0.0.1"
  port: 8765
  enabled: true

animations:
  enabled: true
  duration: 0.2

gaps:
  inner: 4
  outer: 8