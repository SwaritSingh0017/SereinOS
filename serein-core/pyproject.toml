[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serein-core"
version = "0.2.0"
description = "SereinOS Core AI Companion Service"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SereinOS", email = "dev@serein-os.org"}
]
keywords = ["ai", "companion", "assistant", "os", "wayland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "dbus-next>=0.2.4",
    "systemd-python>=235",
    "sqlcipher3>=0.5.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "watchdog>=3.0.0",
    "psutil>=5.9.6",
    "croniter>=2.0.0",
    "dateparser>=1.2.0",
    "pyopenssl>=23.2.0",
    "cryptography>=41.0.0",
    "mss>=9.0.1",
    "opencv-python-headless>=4.8.1",
    "pillow>=10.1.0",
    "easyocr>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]

voice = [
    "azure-cognitiveservices-speech>=1.35.0",
    "piper-tts>=1.2.0",
]

vision = [
    "ultralytics>=8.0.0",
    "mediapipe>=0.10.0",
    "paddleocr>=2.7.0",
]

[project.scripts]
serein-core = "serein_core.__main__:main"
serein-cli = "serein_core.cli:cli"

[project.urls]
Homepage = "https://github.com/serein-os/serein-core"
Repository = "https://github.com/serein-os/serein-core"
Issues = "https://github.com/serein-os/serein-core/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["serein_core*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501", "SIM103", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true 
